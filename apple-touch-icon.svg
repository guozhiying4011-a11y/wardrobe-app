<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#ffffff"/>
  <g fill="none" stroke="#1a1a1a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- 完整的衣架 (圆环钩 + V肩 + 底部横杆) -->
    <circle cx="256" cy="110" r="36"/>
    <line x1="256" y1="146" x2="256" y2="178"/>
    <!-- V 形肩 -->
    <polyline points="136,286 256,178 376,286"/>
    <!-- 衣柜外框 (带圆角) -->
    <rect x="136" y="300" width="240" height="148" rx="30"/>
    <!-- 衣柜门分隔 -->
    <line x1="256" y1="300" x2="256" y2="420"/>
  </g>
  <!-- 横杆 (实心粗条) -->
  <rect x="128" y="282" width="256" height="24" rx="12" fill="#1a1a1a"/>
  <!-- 底部中央缺口 (用白色弧线遮挡) -->
  <path d="M236 448 Q256 430 276 448" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <!-- 红色门把手 -->
  <rect x="206" y="370" width="22" height="46" rx="11" fill="#e02020"/>
  <rect x="284" y="370" width="22" height="46" rx="11" fill="#e02020"/>
</svg>
