<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>智能衣橱</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --brown-deep:#352E2A;
  --brown:#4A3F38;
  --brown-light:#6B5A4E;
  --cream:#EBDEC6;
  --cream-light:#F5EDDF;
  --cream-dark:#D9C9AE;
  --caramel:#B57743;
  --caramel-light:#C8895A;
  --orange:#E86C2F;
  --orange-light:#F2864A;
  --white:#FFFFFF;
  --text-dark:#352E2A;
  --text-mid:#6B5A4E;
  --text-light:#A0917F;
  --bg:#F5EDDF;
  --card:#FFFFFF;
  --shadow:0 2px 12px rgba(53,46,42,0.08);
  --shadow-lg:0 8px 28px rgba(53,46,42,0.14);
  --radius:20px;
  --radius-sm:14px;
  --radius-xs:10px;
  --tabbar-h:68px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text-dark);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 12px);
  min-height:100vh;
}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(53,46,42,0.15);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}

/* ========== 通用 ========== */
.page{display:none;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.section-title{font-size:17px;font-weight:700;color:var(--text-dark);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.section-title .more{font-size:13px;font-weight:400;color:var(--text-light)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

.btn{padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:active{background:var(--caramel)}
.btn-cream{background:var(--cream);color:var(--text-dark)}
.btn-ghost{background:transparent;color:var(--text-mid);border:1px solid var(--cream-dark)}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-block{width:100%}

/* ========== 顶部Header(棕色) ========== */
.app-header{
  background:var(--brown-deep);color:var(--cream);
  padding:20px 20px 24px;border-radius:0 0 28px 28px;
  position:relative;
}
.app-header .greeting{font-size:13px;color:var(--cream-dark);margin-bottom:4px}
.app-header .title{font-size:24px;font-weight:700;color:var(--white)}
.app-header .sub{font-size:13px;color:var(--cream-dark);margin-top:4px}
.app-header .header-row{display:flex;justify-content:space-between;align-items:flex-start}
.app-header .avatar{
  width:40px;height:40px;border-radius:50%;
  background:var(--caramel);display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;font-weight:600;
}

/* 天气场景卡片 */
.weather-card{
  margin:16px 20px 0;background:var(--cream);border-radius:var(--radius);
  padding:16px;display:flex;align-items:center;gap:14px;
}
.weather-card .w-icon{font-size:36px}
.weather-card .w-info{flex:1}
.weather-card .w-temp{font-size:20px;font-weight:700;color:var(--text-dark)}
.weather-card .w-desc{font-size:12px;color:var(--text-mid);margin-top:2px}
.weather-card .w-suggest{font-size:12px;color:var(--caramel);font-weight:600;margin-top:2px}

/* ========== 首页推荐 ========== */
.page-content{padding:20px;margin-top:8px}
.today-outfit{margin-bottom:20px}
.today-outfit .outfit-preview{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;
}
.outfit-item-card{
  flex:0 0 110px;background:var(--card);border-radius:var(--radius-sm);
  overflow:hidden;box-shadow:var(--shadow);
}
.outfit-item-card .img{width:100%;aspect-ratio:3/4;background:var(--cream);overflow:hidden}
.outfit-item-card .img img{width:100%;height:100%;object-fit:cover}
.outfit-item-card .img .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.outfit-item-card .nm{padding:6px 8px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outfit-item-card .pr{padding:0 8px 8px;font-size:11px;color:var(--caramel);font-weight:600}

.recent-section{margin-bottom:20px}
.recent-list{display:flex;flex-direction:column;gap:10px}
.recent-item{display:flex;align-items:center;gap:12px;background:var(--card);padding:10px;border-radius:var(--radius-sm);box-shadow:var(--shadow)}
.recent-item .thumbs{display:flex;gap:-6px;flex:0 0 auto}
.recent-item .thumb{width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--cream);border:2px solid var(--card);margin-left:-8px}
.recent-item .thumb:first-child{margin-left:0}
.recent-item .thumb img{width:100%;height:100%;object-fit:cover}
.recent-item .info{flex:1}
.recent-item .info .nm{font-size:13px;font-weight:600}
.recent-item .info .dt{font-size:11px;color:var(--text-light);margin-top:2px}

/* ========== 衣橱页 ========== */
.wardrobe-header{
  background:var(--brown-deep);color:var(--cream);
  padding:16px 20px 20px;border-radius:0 0 24px 24px;
}
.wardrobe-header .wh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wardrobe-header .wh-title{font-size:20px;font-weight:700;color:#fff}
.wardrobe-header .wh-actions{display:flex;gap:8px}
.wardrobe-header .wh-btn{
  width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;color:var(--cream);
}
.wardrobe-header .wh-btn:active{background:rgba(255,255,255,0.2)}

.search-bar{
  background:rgba(255,255,255,0.1);border-radius:var(--radius-sm);
  padding:10px 14px;display:flex;align-items:center;gap:8px;
}
.search-bar input{flex:1;background:none;border:none;color:#fff;font-size:14px}
.search-bar input::placeholder{color:rgba(235,222,198,0.5)}
.search-bar input:focus{outline:none}
.search-bar svg{fill:rgba(235,222,198,0.5);flex:0 0 auto}

.chip-bar{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;-webkit-overflow-scrolling:touch}
.chip-bar::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 16px;border-radius:20px;
  background:var(--card);color:var(--text-mid);font-size:13px;font-weight:500;
  box-shadow:var(--shadow);transition:all .2s;white-space:nowrap;
}
.chip.active{background:var(--brown-deep);color:var(--cream)}

.clothes-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px}
.clothing-card{background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);position:relative;transition:transform .2s}
.clothing-card:active{transform:scale(0.97)}
.clothing-card .photo{width:100%;aspect-ratio:3/4;background:var(--cream);overflow:hidden;position:relative}
.clothing-card .photo img{width:100%;height:100%;object-fit:cover}
.clothing-card .photo .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.clothing-card .badge{
  position:absolute;top:8px;left:8px;background:rgba(53,46,42,0.7);
  color:#fff;font-size:10px;padding:3px 8px;border-radius:20px;backdrop-filter:blur(4px);
}
.clothing-card .fav{
  position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;
}
.clothing-card .info{padding:10px}
.clothing-card .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clothing-card .meta{display:flex;align-items:center;gap:6px;margin-top:4px}
.clothing-card .meta .cat{font-size:11px;color:var(--text-light)}
.clothing-card .meta .price{font-size:12px;color:var(--caramel);font-weight:600;margin-left:auto}
.clothing-card .meta .worn{font-size:10px;color:var(--text-light)}
.clothing-card .actions{position:absolute;bottom:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.clothing-card:active .actions{opacity:1}

/* 子Tab: 我的搭配 */
.sub-tabs{display:flex;gap:0;padding:0 20px;margin-bottom:12px;border-bottom:2px solid var(--cream)}
.sub-tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--text-light);position:relative;transition:color .2s}
.sub-tab.active{color:var(--brown-deep)}
.sub-tab.active::after{content:"";position:absolute;bottom:-2px;left:0;right:0;height:3px;background:var(--orange);border-radius:2px}

.outfit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px}
.outfit-card{background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow)}
.outfit-card .collage{width:100%;aspect-ratio:1;background:var(--cream);position:relative;overflow:hidden}
.outfit-card .collage img{position:absolute;object-fit:cover;border-radius:8px}
.outfit-card .collage .c1{top:6px;left:6px;width:48%;height:55%}
.outfit-card .collage .c2{top:6px;right:6px;width:48%;height:55%}
.outfit-card .collage .c3{bottom:6px;left:6px;width:48%;height:40%}
.outfit-card .collage .c4{bottom:6px;right:6px;width:48%;height:40%}
.outfit-card .collage .ph{position:absolute;display:flex;align-items:center;justify-content:center;background:var(--cream-dark)}
.outfit-card .oinfo{padding:10px}
.outfit-card .oname{font-size:13px;font-weight:600}
.outfit-card .ometa{font-size:11px;color:var(--text-light);margin-top:3px}

/* ========== 灵感页 ========== */
.inspire-header{background:var(--brown-deep);color:var(--cream);padding:16px 20px 20px;border-radius:0 0 24px 24px}
.inspire-header .ih-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.inspire-header .ih-sub{font-size:13px;color:var(--cream-dark)}
.inspire-actions{display:flex;gap:10px;padding:16px 20px 8px}
.inspire-actions .btn{flex:1}

.inspire-chips{display:flex;gap:8px;overflow-x:auto;padding:8px 20px 12px;-webkit-overflow-scrolling:touch}
.inspire-chips::-webkit-scrollbar{display:none}

.masonry{columns:2;column-gap:10px;padding:8px 20px}
.masonry-item{break-inside:avoid;margin-bottom:10px;background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);position:relative}
.masonry-item .mimg{width:100%;display:block;background:var(--cream)}
.masonry-item .mimg img{width:100%;display:block}
.masonry-item .minfo{padding:8px}
.masonry-item .mcats{display:flex;gap:4px;flex-wrap:wrap}
.masonry-item .mcat{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--cream);color:var(--text-mid)}
.masonry-item .mdel{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}

/* ========== 我的页 ========== */
.profile-header{background:var(--brown-deep);color:var(--cream);padding:24px 20px 28px;border-radius:0 0 28px 28px;text-align:center}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:var(--caramel);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:600}
.profile-name{font-size:18px;font-weight:700;color:#fff}
.profile-tag{font-size:12px;color:var(--cream-dark);margin-top:4px}
.profile-stats{display:flex;justify-content:center;gap:24px;margin-top:16px}
.profile-stat .num{font-size:22px;font-weight:700;color:var(--cream)}
.profile-stat .lbl{font-size:11px;color:var(--cream-dark);margin-top:2px}

.profile-menu{padding:16px 20px}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);margin-bottom:10px}
.menu-item .micon{width:36px;height:36px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.menu-item .mtext{flex:1}
.menu-item .mtext .mt{font-size:14px;font-weight:600}
.menu-item .mtext .ms{font-size:12px;color:var(--text-light);margin-top:2px}
.menu-item .arrow{color:var(--text-light)}

/* ========== 底部TabBar ========== */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:var(--card);border-top:1px solid var(--cream);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 -2px 12px rgba(53,46,42,0.06);
}
.tabbar-inner{display:flex;width:100%;max-width:480px;align-items:center;justify-content:space-around;height:var(--tabbar-h)}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text-light);font-size:10px;transition:color .2s;flex:1;
}
.tab .ticon{width:24px;height:24px;fill:currentColor}
.tab.active{color:var(--orange)}
.tab-add{
  flex:0 0 52px;width:52px;height:52px;border-radius:50%;
  background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;
  margin-top:-20px;box-shadow:0 4px 16px rgba(232,108,47,0.4);transition:transform .15s;
  position:relative;z-index:101;cursor:pointer;
}
.tab-add:active{transform:scale(0.92)}
.tab-add svg{width:28px;height:28px;fill:#fff}

/* ========== 弹窗 ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(53,46,42,0.5);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h2{font-size:18px;font-weight:700;color:var(--text-dark)}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-mid)}

/* 表单 */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-dark);margin-bottom:6px}
.form-input,.form-textarea,.form-select{
  width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:var(--radius-xs);
  padding:12px 14px;font-size:14px;color:var(--text-dark);transition:border-color .2s;
}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--caramel)}
.form-textarea{resize:vertical;min-height:60px}

.chip-group{display:flex;gap:8px;flex-wrap:wrap}
.chip-opt{padding:8px 14px;border-radius:20px;background:var(--bg);color:var(--text-mid);font-size:13px;font-weight:500;transition:all .2s}
.chip-opt.selected{background:var(--brown-deep);color:var(--cream)}

.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s;position:relative}
.color-opt.selected{border-color:var(--orange);transform:scale(1.1)}

.photo-upload{width:100%;aspect-ratio:16/9;background:var(--bg);border:2px dashed var(--cream-dark);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:border-color .2s}
.photo-upload:active{border-color:var(--caramel)}
.photo-upload img{width:100%;height:100%;object-fit:cover}
.photo-upload .ph-text{text-align:center;color:var(--text-light)}
.photo-upload .ph-text svg{margin:0 auto 6px;display:block}
.photo-upload .ph-text p{font-size:12px}

.rating{display:flex;gap:4px}
.rating .star{font-size:24px;color:var(--cream-dark);cursor:pointer;transition:color .15s}
.rating .star.active{color:var(--orange)}

.form-actions{display:flex;gap:10px;margin-top:18px}
.form-actions .btn{flex:1}

/* 衣物选择器 */
.picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:50vh;overflow-y:auto}
.picker-card{text-align:center;cursor:pointer;border-radius:var(--radius-xs);overflow:hidden;border:2px solid transparent;transition:all .15s;background:var(--bg)}
.picker-card.selected{border-color:var(--orange)}
.picker-card .pc-img{width:100%;aspect-ratio:1;background:var(--cream);overflow:hidden}
.picker-card .pc-img img{width:100%;height:100%;object-fit:cover}
.picker-card .pc-nm{font-size:11px;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

/* Toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--brown-deep);color:var(--cream);border-radius:var(--radius-sm);padding:12px 22px;font-size:14px;z-index:300;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 空状态 */
.empty{text-align:center;padding:48px 20px}
.empty svg{margin:0 auto 12px;display:block;opacity:0.25}
.empty p{font-size:14px;color:var(--text-light);margin-bottom:4px}
.empty .hint{font-size:12px;color:var(--text-light)}

/* 灵感详情 */
.inspire-detail-img{width:100%;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:12px}
.inspire-detail-img img{width:100%;display:block}
.tag-input-row{display:flex;gap:8px}
.tag-input-row input{flex:1}
</style>
</head>
<body>

<!-- ============ 首页 ============ -->
<div class="page active" id="page-home">
  <div class="app-header">
    <div class="header-row">
      <div>
        <div class="greeting" id="homeGreeting">你好</div>
        <div class="title">智能衣橱</div>
        <div class="sub" id="homeDate"></div>
      </div>
      <div class="avatar" onclick="switchTab('profile',document.querySelector('.tab[onclick*=profile]'))">我</div>
    </div>
  </div>
  <div class="weather-card" id="weatherCard"></div>
  <div class="page-content">
    <div class="today-outfit">
      <div class="section-title">
        今日推荐
        <span class="more" onclick="generateTodayOutfit()">换一套</span>
      </div>
      <div class="outfit-preview" id="todayOutfit"></div>
    </div>
    <div class="recent-section">
      <div class="section-title">最近穿搭</div>
      <div class="recent-list" id="recentList"></div>
    </div>
  </div>
</div>

<!-- ============ 衣橱页 ============ -->
<div class="page" id="page-wardrobe">
  <div class="wardrobe-header">
    <div class="wh-top">
      <div class="wh-title">我的衣橱</div>
      <div class="wh-actions">
        <div class="wh-btn" onclick="switchSubTab('clothes')" id="subTabClothesBtn" title="衣物">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.38 3.46L16 2a4 4 0 0 0-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84h.42l-.92 8.65A2 2 0 0 0 5.36 21h13.28a2 2 0 0 0 1.99-2.35l-.92-8.65h.42a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.32-2.23zM12 4a2 2 0 0 1 2 2h-4a2 2 0 0 1 2-2zm-6 6h12v2H6v-2zm1.1 10l.9-8h8l.9 8H7.1z"/></svg>
        </div>
        <div class="wh-btn" onclick="switchSubTab('outfits')" id="subTabOutfitsBtn" title="搭配">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zm0 7L4.5 5.5 12 3l7.5 2.5L12 9zm0 4L2 8v9l10 5 10-5V8l-10 5z"/></svg>
        </div>
      </div>
    </div>
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="搜索衣物名称或品牌...">
    </div>
  </div>

  <!-- 子Tab -->
  <div class="sub-tabs">
    <div class="sub-tab active" id="st-clothes" onclick="switchSubTab('clothes')">我的衣物</div>

    <div id="inspireDetailContent"></div>

<div class="toast" id="toast"></div>

<script>
/* ========== 数据层 ========== */
const DB={CLOTHES:'wc_clothes',OUTFITS:'wc_outfits',RECORDS:'wc_records',INSPIRES:'wc_inspires',
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}};

const COLORS=[{n:'黑色',h:'#1a1a1a'},{n:'白色',h:'#ffffff'},{n:'灰色',h:'#9ca3af'},{n:'红色',h:'#ef4444'},{n:'橙色',h:'#f97316'},{n:'黄色',h:'#eab308'},{n:'绿色',h:'#22c55e'},{n:'蓝色',h:'#3b82f6'},{n:'紫色',h:'#a855f7'},{n:'粉色',h:'#ec4899'},{n:'棕色',h:'#92400e'},{n:'米色',h:'#d4b896'},{n:'藏青',h:'#1e3a5f'},{n:'卡其',h:'#a88B5A'}];
const CATEGORIES=['上衣','裤子','裙子','外套','鞋','配饰'];
const STYLES=['通勤','休闲','极简','法式','温柔','酷飒','韩系','复古','运动'];
const SEASONS=['春','夏','秋','冬'];
const SEASON_EMOJI={春:'🌸',夏:'☀️',秋:'🍂',冬:'❄️'};
const INSPIRE_CATS=['日常通勤','约会穿搭','度假风','运动休闲','韩系穿搭','法式优雅','街头酷飒','温柔甜美','其他'];

let clothes=DB.get(DB.CLOTHES,[]);
let outfits=DB.get(DB.OUTFITS,[]);
let records=DB.get(DB.RECORDS,[]);
let inspires=DB.get(DB.INSPIRES,[]);
let currentCategory='';
let currentInspireCat='';
let outfitBuilder={};
let editRecordDate=null;

/* ========== 工具 ========== */
const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(msg,type='info'){const t=$('toast');t.textContent=msg;t.className='toast show';setTimeout(()=>t.classList.remove('show'),2000)}
function openModal(id){$(id).classList.add('show')}
function closeModal(id){$(id).classList.remove('show')}
function getClothing(id){return clothes.find(c=>c.id===id)}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${da}`}
function imgPh(){return '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%"><svg width="40" height="40" viewBox="0 0 24 24" fill="rgba(53,46,42,0.15)"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>'}

/* ========== Tab切换 ========== */
function switchTab(page,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+page).classList.add('active');
  document.querySelectorAll('.tabbar .tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  if(page==='home')renderHome();
  if(page==='wardrobe'){renderClothes();renderOutfits();}
  if(page==='inspire')renderInspire();
  if(page==='profile')renderProfile();
  window.scrollTo(0,0);
}

function switchSubTab(which){
  $('st-clothes').classList.toggle('active',which==='clothes');
  $('st-outfits').classList.toggle('active',which==='outfits');
  $('view-clothes').style.display=which==='clothes'?'block':'none';
  $('view-outfits').style.display=which==='outfits'?'block':'none';
}

/* ========== 初始化选择器 ========== */
function initPickers(){
  $('categoryPicker').innerHTML=CATEGORIES.map(c=>`<div class="chip-opt" data-val="${c}" onclick="selectChip(this)">${c}</div>`).join('');
  $('stylePicker').innerHTML=STYLES.map(s=>`<div class="chip-opt" data-val="${s}" onclick="toggleChip(this)">${s}</div>`).join('');
  $('seasonPicker').innerHTML=SEASONS.map(s=>`<div class="chip-opt" data-val="${s}" onclick="toggleChip(this)">${SEASON_EMOJI[s]}${s}</div>`).join('');
  $('colorPicker').innerHTML=COLORS.map(c=>`<div class="color-opt" data-n="${c.n}" data-h="${c.h}" style="background:${c.h}" onclick="selectColor(this)"></div>`).join('');
  $('outfitStylePicker').innerHTML=STYLES.map(s=>`<div class="chip-opt" data-val="${s}" onclick="toggleChip(this)">${s}</div>`).join('');
  $('inspireCatPicker').innerHTML=INSPIRE_CATS.map(c=>`<div class="chip-opt" data-val="${c}" onclick="toggleChip(this)">${c}</div>`).join('');
  $('urlCatPicker').innerHTML=INSPIRE_CATS.map(c=>`<div class="chip-opt" data-val="${c}" onclick="toggleChip(this)">${c}</div>`).join('');
  // 评分
  let rh='';
  for(let i=1;i<=5;i++)rh+=`<span class="star" data-v="${i}" onclick="setRating(${i})">★</span>`;
  $('ratingPicker').innerHTML=rh;
}
function selectChip(el){el.parentElement.querySelectorAll('.chip-opt').forEach(o=>o.classList.remove('selected'));el.classList.add('selected')}
function toggleChip(el){el.classList.toggle('selected')}
function selectColor(el){el.parentElement.querySelectorAll('.color-opt').forEach(o=>o.classList.remove('selected'));el.classList.add('selected')}
let currentRating=0;
function setRating(v){currentRating=v;document.querySelectorAll('#ratingPicker .star').forEach((s,i)=>s.classList.toggle('active',i<v))}

/* ========== 衣物管理 ========== */
function renderCategoryChips(){
  const chips=$('categoryChips');
  let html=`<div class="chip ${currentCategory===''?'active':''}" onclick="setCategory('')">全部</div>`;
  html+=CATEGORIES.map(c=>`<div class="chip ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</div>`).join('');
  chips.innerHTML=html;
}
function setCategory(c){currentCategory=c;renderClothes()}

function renderClothes(){
  renderCategoryChips();
  const grid=$('clothesGrid');
  const search=$('searchInput').value.toLowerCase();
  let filtered=clothes.filter(c=>{
    if(search&&!(c.name.toLowerCase().includes(search)||(c.brand||'').toLowerCase().includes(search)))return false;
    if(currentCategory&&c.category!==currentCategory)return false;
    return true;
  });
  if(filtered.length===0){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><svg width="56" height="56" viewBox="0 0 24 24" fill="var(--text-light)"><path d="M20.38 3.46L16 2a4 4 0 0 0-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84h.42l-.92 8.65A2 2 0 0 0 5.36 21h13.28a2 2 0 0 0 1.99-2.35l-.92-8.65h.42a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.32-2.23z"/></svg><p>${clothes.length===0?'衣橱还是空的':'没有匹配的衣物'}</p><p class="hint">${clothes.length===0?'点击底部+添加衣物':'试试调整搜索或筛选'}</p></div>`;
    return;
  }
  grid.innerHTML=filtered.map(c=>{
    const colorObj=COLORS.find(co=>co.n===c.color);
    const wornCount=records.filter(r=>{const o=outfits.find(o=>o.id===r.outfitId);return o&&o.items.includes(c.id)}).length;
    return`<div class="clothing-card" onclick="editClothing('${c.id}')">
      <div class="photo">${c.image?`<img src="${c.image}">`:`<div class="ph">${imgPh()}</div>`}
        <div class="badge">${c.category}</div>
      </div>
      <div class="info">
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="meta">
          ${c.color?`<span class="color-dot" style="width:12px;height:12px;border-radius:50%;background:${colorObj?colorObj.h:'#888'};border:1px solid rgba(0,0,0,0.1)"></span>`:''}
          <span class="cat">${(c.style||[]).slice(0,2).join(' · ')||(c.brand||'')}</span>
          ${c.price?`<span class="price">¥${c.price}</span>`:''}
        </div>
        ${wornCount>0?`<div class="meta" style="margin-top:2px"><span class="worn">穿过 ${wornCount} 次</span></div>`:''}
      </div>
    </div>`;
  }).join('');
}

function openClothingModal(id){

function handlePhotoUpload(e){

function randomOutfitToSave(){
  if(clothes.length===0){toast('衣橱是空的','error');return}
  outfitBuilder={};
  const m=new Date().getMonth();let season;
  if(m>=2&&m<=4)season='春';else if(m>=5&&m<=7)season='夏';else if(m>=8&&m<=10)season='秋';else season='冬';
  OUTFIT_SLOTS.forEach(s=>{

function renderHome(){

  let g='你好';
  if(h<6)g='夜深了';else if(h<12)g='早上好';else if(h<14)g='中午好';else if(h<18)g='下午好';else g='晚上好';
  $('homeGreeting').textContent=g;
  const days=['周日','周一','周二','周三','周四','周五','周六'];
  $('homeDate').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
  
  // 天气卡(模拟)
  const m=now.getMonth();
  let temp,desc,suggest;
  if(m>=2&&m<=4){temp='18-25°';desc='春季 温暖';suggest='适合轻薄外套'}
  else if(m>=5&&m<=7){temp='28-35°';desc='夏季 炎热';suggest='穿透气轻薄'}
  else if(m>=8&&m<=10){temp='15-22°';desc='秋季 凉爽';suggest='叠穿好时节'}
  else{temp='0-8°';desc='冬季 寒冷';suggest='注意保暖'}
  $('weatherCard').innerHTML=`<div class="w-icon">${m>=5&&m<=7?'☀️':m>=11||m<=1?'❄️':m>=2&&m<=4?'🌸':'🍂'}</div><div class="w-info"><div class="w-temp">${temp}</div><div class="w-desc">${desc}</div><div class="w-suggest">${suggest}</div></div>`;

  generateTodayOutfit();
  
  // 最近穿搭
  renderRecent();
}

function generateTodayOutfit(){
  const container=$('todayOutfit');

    container.innerHTML=`<div class="empty"><p>衣橱是空的,先添加衣物</p></div>`;
    return;
  }
  const m=new Date().getMonth();let season;
  if(m>=2&&m<=4)season='春';else if(m>=5&&m<=7)season='夏';else if(m>=8&&m<=10)season='秋';else season='冬';
  const picks=[];
  OUTFIT_SLOTS.forEach(s=>{
    let pool=clothes.filter(c=>c.category===s);if(pool.length===0)return;
    const sm=pool.filter(c=>(c.season||[]).includes(season));
    const fp=sm.length>0?sm:pool;
