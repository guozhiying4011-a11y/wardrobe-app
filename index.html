<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>智能衣橱</title>
<style>
/* ==================== 全局重置与变量 ==================== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-1:#0f0f0f; --bg-2:#1a1a2e;
  --card:rgba(255,255,255,0.05);
  --card-hover:rgba(255,255,255,0.09);
  --border:rgba(255,255,255,0.1);
  --text:#f0f0f0; --text-dim:#a0a0b0; --text-mute:#6b6b80;
  --accent:#a855f7; --accent-2:#3b82f6;
  --gradient:linear-gradient(135deg,#a855f7,#3b82f6);
  --danger:#ef4444; --success:#22c55e; --warning:#f59e0b;
  --radius:16px; --radius-sm:10px;
  --tabbar-h:64px;
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--bg-1),var(--bg-2));
  color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabbar-h) + 16px);
}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ==================== 头部 ==================== */
.header{
  position:sticky;top:0;z-index:50;
  background:rgba(15,15,15,0.85);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:16px 20px 12px;
}
.header h1{
  font-size:22px;font-weight:700;
  background:var(--gradient);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;letter-spacing:1px;
}
.header p{font-size:12px;color:var(--text-mute);margin-top:2px}

/* ==================== Tab 内容区 ==================== */
.tab-page{display:none;padding:16px;animation:fadeIn .3s ease}
.tab-page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ==================== 通用组件 ==================== */
.section-title{
  font-size:16px;font-weight:600;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.section-title .dot{width:4px;height:16px;border-radius:2px;background:var(--gradient)}

.toolbar{
  display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;
}
.search-box{
  flex:1;min-width:160px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;
  font-size:14px;color:var(--text);transition:border-color .2s;
}
.search-box:focus{outline:none;border-color:var(--accent)}
.search-box::placeholder{color:var(--text-mute)}

.select{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;
  font-size:14px;color:var(--text);cursor:pointer;
}
.select option{background:#1a1a2e;color:var(--text)}

.btn{
  padding:10px 18px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:500;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn-primary{background:var(--gradient);color:#fff}
.btn-primary:hover{box-shadow:0 0 20px rgba(168,85,247,0.4);transform:translateY(-1px)}
.btn-ghost{background:var(--card);color:var(--text-dim);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--card-hover);color:var(--text)}
.btn-danger{background:rgba(239,68,68,0.15);color:var(--danger)}
.btn-danger:hover{background:rgba(239,68,68,0.25)}
.btn-sm{padding:6px 12px;font-size:12px}

/* ==================== 衣物卡片 ==================== */
.clothes-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;
}
.clothing-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;transition:all .25s;
  position:relative;
}
.clothing-card:hover{
  border-color:rgba(168,85,247,0.4);transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.clothing-card .photo{
  width:100%;aspect-ratio:1;background:#222;display:flex;
  align-items:center;justify-content:center;overflow:hidden;position:relative;
}
.clothing-card .photo img{width:100%;height:100%;object-fit:cover}
.clothing-card .photo .placeholder{font-size:40px;opacity:0.3}
.clothing-card .info{padding:10px 12px}
.clothing-card .name{font-size:14px;font-weight:600;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clothing-card .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{
  font-size:11px;padding:2px 8px;border-radius:20px;
  background:rgba(168,85,247,0.15);color:var(--accent);
}
.tag.season{background:rgba(59,130,246,0.15);color:var(--accent-2)}
.color-dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,0.3);display:inline-block}
.clothing-card .actions{
  position:absolute;top:8px;right:8px;display:flex;gap:4px;
  opacity:0;transition:opacity .2s;
}
.clothing-card:hover .actions{opacity:1}
.clothing-card .actions button{
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.clothing-card .actions button:hover{background:rgba(0,0,0,0.8)}

/* ==================== 空状态 ==================== */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-mute);
}
.empty-state .icon{font-size:56px;margin-bottom:16px;opacity:0.3}
.empty-state p{font-size:14px;margin-bottom:8px}
.empty-state .hint{font-size:12px;color:var(--text-mute)}

/* ==================== 弹窗 ==================== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  backdrop-filter:blur(4px);z-index:100;
  display:none;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s;
}
.modal-overlay.show{display:flex}
.modal{
  background:linear-gradient(160deg,#1e1e30,#16162a);
  border:1px solid var(--border);border-radius:24px 24px 0 0;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  padding:24px 20px;animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{font-size:18px;font-weight:600}
.modal-close{
  width:32px;height:32px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  color:var(--text-dim);transition:all .2s;
}
.modal-close:hover{background:var(--card-hover);color:var(--text)}

/* ==================== 表单 ==================== */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:500}
.form-input,.form-textarea,.form-select{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;
  color:var(--text);transition:border-color .2s;
}
.form-input:focus,.form-textarea:focus,.form-select:focus{
  outline:none;border-color:var(--accent);
}
.form-textarea{resize:vertical;min-height:70px}
.form-select option{background:#1a1a2e}

.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-option{
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:all .2s;position:relative;
}
.color-option.selected{border-color:#fff;transform:scale(1.15)}
.color-option.selected::after{
  content:"\2713";position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;font-weight:700;
  text-shadow:0 0 4px rgba(0,0,0,0.8);
}

.season-picker{display:flex;gap:8px;flex-wrap:wrap}
.season-option{
  padding:8px 16px;border-radius:20px;background:var(--card);
  border:1px solid var(--border);font-size:13px;cursor:pointer;
  transition:all .2s;color:var(--text-dim);
}
.season-option.selected{background:var(--gradient);color:#fff;border-color:transparent}

.photo-upload{
  width:100%;aspect-ratio:2;background:var(--card);
  border:2px dashed var(--border);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;position:relative;transition:border-color .2s;
}
.photo-upload:hover{border-color:var(--accent)}
.photo-upload img{width:100%;height:100%;object-fit:cover}
.photo-upload .upload-hint{text-align:center;color:var(--text-mute)}
.photo-upload .upload-hint .icon{font-size:32px;margin-bottom:4px}
.photo-upload .upload-hint p{font-size:12px}

.form-actions{display:flex;gap:10px;margin-top:20px}
.form-actions .btn{flex:1;justify-content:center}

/* ==================== 穿搭搭配 ==================== */
.outfit-builder{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:16px;
}
.outfit-slots{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.outfit-slot{
  flex:0 0 100px;text-align:center;
}
.outfit-slot .slot-label{font-size:11px;color:var(--text-mute);margin-bottom:6px}
.outfit-slot .slot-box{
  width:100px;height:100px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.03);border:2px dashed var(--border);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:pointer;transition:all .2s;position:relative;
}
.outfit-slot .slot-box:hover{border-color:var(--accent)}
.outfit-slot .slot-box img{width:100%;height:100%;object-fit:cover}
.outfit-slot .slot-box .placeholder{font-size:28px;opacity:0.2}
.outfit-slot .slot-box .remove{
  position:absolute;top:4px;right:4px;width:20px;height:20px;
  border-radius:50%;background:rgba(0,0,0,0.7);font-size:12px;
  display:flex;align-items:center;justify-content:center;
}

.saved-outfits{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.outfit-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;transition:all .25s;
}
.outfit-card:hover{border-color:rgba(168,85,247,0.3);transform:translateY(-2px)}
.outfit-card .outfit-name{font-size:15px;font-weight:600;margin-bottom:10px}
.outfit-card .outfit-items{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.outfit-card .outfit-item{
  flex:0 0 56px;width:56px;height:56px;border-radius:8px;
  overflow:hidden;background:#222;position:relative;
}
.outfit-card .outfit-item img{width:100%;height:100%;object-fit:cover}
.outfit-card .outfit-item .label{
  position:absolute;bottom:0;left:0;right:0;
  font-size:9px;text-align:center;background:rgba(0,0,0,0.7);
  padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.outfit-card .outfit-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.outfit-card .outfit-date{font-size:11px;color:var(--text-mute)}

/* ==================== 穿着记录 ==================== */
.calendar{margin-bottom:16px}
.calendar-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.calendar-header .month{font-size:16px;font-weight:600}
.calendar-header .nav-btn{
  width:32px;height:32px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.calendar-header .nav-btn:hover{background:var(--card-hover)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar-weekday{
  text-align:center;font-size:11px;color:var(--text-mute);padding:4px 0;
}
.calendar-day{
  aspect-ratio:1;border-radius:8px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:13px;position:relative;
}
.calendar-day:hover{background:var(--card-hover)}
.calendar-day.empty{background:transparent;cursor:default}
.calendar-day.today{border:1px solid var(--accent)}
.calendar-day.has-record{background:rgba(168,85,247,0.2);border:1px solid rgba(168,85,247,0.4)}
.calendar-day .day-num{font-weight:500}
.calendar-day .dot-indicator{
  width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px;
}

.record-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
}
.stat-card .stat-label{font-size:12px;color:var(--text-mute);margin-bottom:4px}
.stat-card .stat-value{font-size:24px;font-weight:700}
.stat-card .stat-value .unit{font-size:14px;color:var(--text-dim);font-weight:400}

.top-worn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.top-worn .title{font-size:13px;color:var(--text-dim);margin-bottom:10px}
.top-worn-item{
  display:flex;align-items:center;gap:10px;padding:6px 0;
}
.top-worn-item .rank{font-size:12px;color:var(--text-mute);width:20px;text-align:center}
.top-worn-item .thumb{
  width:36px;height:36px;border-radius:8px;overflow:hidden;background:#222;
}
.top-worn-item .thumb img{width:100%;height:100%;object-fit:cover}
.top-worn-item .info{flex:1}
.top-worn-item .name{font-size:13px;font-weight:500}
.top-worn-item .count{font-size:11px;color:var(--text-mute)}
.top-worn-item .bar{
  height:4px;border-radius:2px;background:var(--gradient);margin-top:2px;
}

/* ==================== 分类统计 ==================== */
.stats-overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.overview-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;text-align:center;
}
.overview-card .num{font-size:28px;font-weight:700;background:var(--gradient);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.overview-card .label{font-size:12px;color:var(--text-mute);margin-top:4px}

.chart-section{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:16px;
}
.chart-section .chart-title{font-size:14px;font-weight:600;margin-bottom:14px}

.pie-chart{
  width:160px;height:160px;border-radius:50%;margin:0 auto 16px;
  position:relative;
}
.pie-legend{display:flex;flex-direction:column;gap:6px}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
.pie-legend-item .swatch{width:12px;height:12px;border-radius:3px}
.pie-legend-item .pct{margin-left:auto;color:var(--text-mute);font-size:12px}

.bar-chart{display:flex;gap:12px;align-items:flex-end;height:140px;padding:0 8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-col .bar{width:60%;border-radius:6px 6px 0 0;min-height:4px;transition:height .6s ease}
.bar-col .bar-label{font-size:11px;color:var(--text-dim)}
.bar-col .bar-val{font-size:12px;font-weight:600}

.color-stats{display:flex;flex-wrap:wrap;gap:10px}
.color-stat-item{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.03);padding:6px 12px;border-radius:20px;
}
.color-stat-item .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,0.2)}
.color-stat-item .cnt{font-size:12px;color:var(--text-dim)}

/* ==================== 底部 Tab 栏 ==================== */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  height:var(--tabbar-h);
  background:rgba(15,15,15,0.9);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;justify-content:center;
}
.tabbar-inner{display:flex;width:100%;max-width:640px}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  color:var(--text-mute);transition:color .2s;position:relative;
}
.tabbar .tab .icon{width:22px;height:22px;line-height:1;fill:currentColor}
.tabbar .tab .label{font-size:10px}
.tabbar .tab.active{color:var(--accent)}
.tabbar .tab.active::before{
  content:"";position:absolute;top:0;width:24px;height:2px;
  border-radius:0 0 4px 4px;background:var(--gradient);
}

/* ==================== Toast ==================== */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:rgba(30,30,48,0.95);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 20px;font-size:14px;
  z-index:200;opacity:0;transition:all .3s;pointer-events:none;
  backdrop-filter:blur(12px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(34,197,94,0.4)}
.toast.error{border-color:rgba(239,68,68,0.4)}
.toast.info{border-color:rgba(168,85,247,0.4)}

/* ==================== 选择器弹窗 ==================== */
.picker-modal .modal{max-height:80vh}
.picker-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;max-height:50vh;overflow-y:auto}
.picker-item{
  text-align:center;cursor:pointer;border-radius:var(--radius-sm);
  overflow:hidden;border:2px solid transparent;transition:all .2s;
  background:var(--card);
}
.picker-item:hover{border-color:var(--accent)}
.picker-item.selected{border-color:var(--accent)}
.picker-item .img{width:100%;aspect-ratio:1;background:#222;overflow:hidden}
.picker-item .img img{width:100%;height:100%;object-fit:cover}
.picker-item .img .placeholder{font-size:24px;opacity:0.2;line-height:90px}
.picker-item .nm{font-size:11px;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ==================== 响应式 ==================== */
@media(min-width:600px){
  .clothes-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .tabbar{max-width:640px;left:50%;transform:translateX(-50%)}
}
</style>
</head>
<body>

<!-- 头部 -->
<div class="header">
  <h1>智能衣橱</h1>
  <p id="headerSub">管理你的衣物,记录每日穿搭</p>
</div>

<!-- ============ Tab 1: 我的衣橱 ============ -->
<div class="tab-page active" id="page-wardrobe">
  <div class="toolbar">
    <input type="text" class="search-box" id="searchInput" placeholder="搜索衣物名称或品牌...">
    <select class="select" id="filterCategory">
      <option value="">全部类别</option>
      <option value="上衣">上衣</option>
      <option value="裤子">裤子</option>
      <option value="裙子">裙子</option>
      <option value="外套">外套</option>
      <option value="鞋">鞋</option>
      <option value="配饰">配饰</option>
    </select>
    <select class="select" id="filterSeason">
      <option value="">全部季节</option>
      <option value="春">春</option>
      <option value="夏">夏</option>
      <option value="秋">秋</option>
      <option value="冬">冬</option>
    </select>
  </div>
  <button class="btn btn-primary" onclick="openClothingModal()" style="margin-bottom:16px;width:100%;justify-content:center">
    + 添加衣物
  </button>
  <div class="clothes-grid" id="clothesGrid"></div>
</div>

<!-- ============ Tab 2: 穿搭搭配 ============ -->
<div class="tab-page" id="page-outfit">
  <div class="section-title"><span class="dot"></span>搭配编辑器</div>
  <div class="outfit-builder">
    <div class="outfit-slots" id="outfitSlots"></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="randomOutfit()">随机推荐</button>
      <button class="btn btn-ghost btn-sm" onclick="clearOutfitBuilder()">清空</button>
      <button class="btn btn-ghost btn-sm" onclick="saveOutfit()" style="margin-left:auto">保存方案</button>
    </div>
  </div>
  <div class="section-title"><span class="dot"></span>已保存的穿搭方案</div>
  <div class="saved-outfits" id="savedOutfits"></div>
</div>

<!-- ============ Tab 3: 穿着记录 ============ -->
<div class="tab-page" id="page-record">
  <div class="section-title"><span class="dot"></span>日历</div>
  <div class="calendar">
    <div class="calendar-header">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>

<script>
/* ==================== 数据层 ==================== */
const DB = {
  clothes: 'wardrobe_clothes',
  outfits: 'wardrobe_outfits',
  records: 'wardrobe_records',
  get(key, def) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
    catch(e) { return def; }
  },
  set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
};

const COLORS = [
  {name:'黑色',hex:'#1a1a1a'},{name:'白色',hex:'#ffffff'},{name:'灰色',hex:'#9ca3af'},
  {name:'红色',hex:'#ef4444'},{name:'橙色',hex:'#f97316'},{name:'黄色',hex:'#eab308'},
  {name:'绿色',hex:'#22c55e'},{name:'青色',hex:'#06b6d4'},{name:'蓝色',hex:'#3b82f6'},
  {name:'紫色',hex:'#a855f7'},{name:'粉色',hex:'#ec4899'},{name:'棕色',hex:'#92400e'},
  {name:'米色',hex:'#d4b896'},{name:'藏青',hex:'#1e3a5f'}
];

const CATEGORIES = ['上衣','裤子','裙子','外套','鞋','配饰'];
const SEASONS = ['春','夏','秋','冬'];
const SEASON_EMOJI = {春:'🌸',夏:'☀️',秋:'🍂',冬:'❄️'};
const CATEGORY_COLORS = {
  '上衣':'#3b82f6','裤子':'#22c55e','裙子':'#ec4899',
  '外套':'#f59e0b','鞋':'#a855f7','配饰':'#06b6d4'
};

let clothes = DB.get(DB.clothes, []);
let outfits = DB.get(DB.outfits, []);
let records = DB.get(DB.records, []);
let calDate = new Date();
let outfitBuilder = {}; // {上衣:itemId, 裤子:itemId, ...}
let editingRecordDate = null;

/* ==================== 通用工具 ==================== */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function $(id) { return document.getElementById(id); }
function toast(msg, type='info') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 2200);
}
function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }
function getClothing(id) { return clothes.find(c => c.id === id); }
function fmtDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* ==================== Tab 切换 ==================== */
function switchTab(page, el) {
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  $('page-' + page).classList.add('active');
  document.querySelectorAll('.tabbar .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const subs = {
    wardrobe: '管理你的衣物,记录每日穿搭',
    outfit: '搭配你的每日穿搭方案',
    record: '查看穿着记录和统计',
    stats: '衣橱数据分析'
  };
  $('headerSub').textContent = subs[page] || '';
  if (page === 'outfit') renderOutfitBuilder();
  if (page === 'outfit') renderSavedOutfits();
  if (page === 'record') renderCalendar();
  if (page === 'stats') renderStats();
  window.scrollTo(0, 0);
}

/* ==================== 颜色选择器初始化 ==================== */
function initColorPicker() {
  const picker = $('colorPicker');
  picker.innerHTML = COLORS.map(c =>
    `<div class="color-option" data-name="${c.name}" data-hex="${c.hex}" style="background:${c.hex}" onclick="selectColor(this)"></div>`
  ).join('');
}
function selectColor(el) {
  el.parentElement.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}
function selectChip(el, containerId) {
  el.parentElement.querySelectorAll('.season-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

/* ==================== 衣物管理 ==================== */
function renderClothes() {
  const grid = $('clothesGrid');
  const search = $('searchInput').value.toLowerCase();
  const fc = $('filterCategory').value;
  const fs = $('filterSeason').value;

  let filtered = clothes.filter(c => {
    if (search && !(c.name.toLowerCase().includes(search) || (c.brand||'').toLowerCase().includes(search))) return false;
    if (fc && c.category !== fc) return false;
    if (fs && !(c.season||[]).includes(fs)) return false;
    return true;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `  <div class="empty-state" style="grid-column:1/-1">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor"><path d="M20.38 3.46L16 2a4 4 0 0 0-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84h.42l-.92 8.65A2 2 0 0 0 5.36 21h13.28a2 2 0 0 0 1.99-2.35l-.92-8.65h.42a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.32-2.23zM12 4a2 2 0 0 1 2 2h-4a2 2 0 0 1 2-2zm-6 6h12v2H6v-2zm1.1 10l.9-8h8l.9 8H7.1z"/></svg>
      <p>${clothes.length === 0 ? '衣橱还是空的' : '没有匹配的衣物'}</p>
      <p class="hint">${clothes.length === 0 ? '点击上方按钮添加你的第一件衣物' : '试试调整搜索或筛选条件'}</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(c => {
    const colorObj = COLORS.find(co => co.name === c.color);
    const seasonTags = (c.season||[]).map(s => `<span class="tag season">${SEASON_EMOJI[s]||''} ${s}</span>`).join('');
    return `<div class="clothing-card">
        <div class="photo">
        ${c.image ? `<img src="${c.image}" alt="${c.name}">` : `<svg class="placeholder" width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>`}
        <div class="actions">
          <button onclick="editClothing('${c.id}')" title="编辑">&#9998;</button>
          <button onclick="deleteClothing('${c.id}')" title="删除">&#128465;</button>
        </div>
      </div>
      <div class="info">
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="tags">
          <span class="tag">${c.category}</span>
          ${c.color ? `<span class="color-dot" style="background:${colorObj?colorObj.hex:'#888'}" title="${c.color}"></span>` : ''}
          ${seasonTags}
        </div>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function openClothingModal(id) {
  $('clothingModalTitle').textContent = id ? '编辑衣物' : '添加衣物';
  $('clothingId').value = id || '';
  $('clothingName').value = '';
  $('clothingBrand').value = '';
  $('clothingNote').value = '';
  $('photoUpload').innerHTML = `<div class="upload-hint"><div class="icon">&#128247;</div><p>点击上传照片</p></div>`;
  $('photoUpload').dataset.image = '';
  document.querySelectorAll('#categoryPicker .season-option').forEach(o => o.classList.remove('selected'));
  document.querySelectorAll('#colorPicker .color-option').forEach(o => o.classList.remove('selected'));
  document.querySelectorAll('#seasonPicker .season-option').forEach(o => o.classList.remove('selected'));

  if (id) {
    const c = getClothing(id);
    if (c) {
      $('clothingName').value = c.name;
      $('clothingBrand').value = c.brand || '';
      $('clothingNote').value = c.note || '';
      if (c.image) {
        $('photoUpload').innerHTML = `<img src="${c.image}" alt="预览">`;
        $('photoUpload').dataset.image = c.image;
      }
      const catEl = document.querySelector(`#categoryPicker [data-val="${c.category}"]`);
      if (catEl) catEl.classList.add('selected');
      const colEl = document.querySelector(`#colorPicker [data-name="${c.color}"]`);
      if (colEl) colEl.classList.add('selected');
      (c.season||[]).forEach(s => {
        const el = document.querySelector(`#seasonPicker [data-val="${s}"]`);
        if (el) el.classList.add('selected');
      });
    }
  }
  openModal('clothingModal');
}

function editClothing(id) { openClothingModal(id); }

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    toast('图片太大,请压缩到2MB以下', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    // 压缩图片
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 400;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.7);
      $('photoUpload').innerHTML = `<img src="${compressed}" alt="预览">`;
      $('photoUpload').dataset.image = compressed;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function saveClothing() {
  const name = $('clothingName').value.trim();
  if (!name) { toast('请输入衣物名称', 'error'); return; }
  const catEl = document.querySelector('#categoryPicker .season-option.selected');
  if (!catEl) { toast('请选择类别', 'error'); return; }

  const colEl = document.querySelector('#colorPicker .color-option.selected');
  const seasons = [...document.querySelectorAll('#seasonPicker .season-option.selected')].map(o => o.dataset.val);

  const id = $('clothingId').value;
  const data = {
    id: id || uid(),
    name,
    category: catEl.dataset.val,
    color: colEl ? colEl.dataset.name : '',
    season: seasons,
    brand: $('clothingBrand').value.trim(),
    note: $('clothingNote').value.trim(),
    image: $('photoUpload').dataset.image || '',
    createdAt: id ? (getClothing(id)?.createdAt || Date.now()) : Date.now()
  };

  if (id) {
    const idx = clothes.findIndex(c => c.id === id);
    if (idx >= 0) clothes[idx] = data;
  } else {
    clothes.push(data);
  }
  DB.set(DB.clothes, clothes);
  closeModal('clothingModal');
  renderClothes();
  toast(id ? '已更新' : '已添加', 'success');
}

function deleteClothing(id) {
  if (!confirm('确定删除这件衣物?相关穿搭和记录中的引用也会被移除。')) return;
  clothes = clothes.filter(c => c.id !== id);
  outfits.forEach(o => o.items = o.items.filter(i => i !== id));
  DB.set(DB.clothes, clothes);
  DB.set(DB.outfits, outfits);
  renderClothes();
  toast('已删除', 'success');
}

/* ==================== 穿搭搭配 ==================== */
const OUTFIT_SLOTS = [
  {key:'上衣', label:'上衣'},
  {key:'外套', label:'外套'},
  {key:'裤子', label:'裤子'},
  {key:'裙子', label:'裙子'},
  {key:'鞋', label:'鞋'},
  {key:'配饰', label:'配饰'}
];

function renderOutfitBuilder() {
  const slots = $('outfitSlots');
  slots.innerHTML = OUTFIT_SLOTS.map(s => {
    const itemId = outfitBuilder[s.key];
    const item = itemId ? getClothing(itemId) : null;
    return `<div class="outfit-slot">
      <div class="slot-label">${s.label}</div>
      <div class="slot-box" onclick="openPicker('${s.key}')">
        ${item ? `<img src="${item.image||''}" onerror="this.style.display='none'">
          <button class="remove" onclick="event.stopPropagation();removeFromSlot('${s.key}')">&times;</button>` : `<div class="placeholder">+</div>`}
      </div>
    </div>`;
  }).join('');
}

function openPicker(slotKey) {
  $('pickerTitle').textContent = `选择${slotKey}`;
  const list = $('pickerList');
  const available = clothes.filter(c => c.category === slotKey);
  if (available.length === 0) {
    list.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" transform="rotate(45 12 12)"/></svg><p>没有${slotKey}类衣物</p></div>`;
  } else {
    list.innerHTML = available.map(c =>
      `<div class="picker-item ${outfitBuilder[slotKey]===c.id?'selected':''}" onclick="pickItem('${slotKey}','${c.id}')">
        <div class="img">${c.image?`<img src="${c.image}">`:'<svg class="placeholder" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>'}</div>
        <div class="nm">${escapeHtml(c.name)}</div>
      </div>`
    ).join('');
  }
  $('pickerModal').dataset.slot = slotKey;
  openModal('pickerModal');
}

function pickItem(slotKey, itemId) {
  outfitBuilder[slotKey] = itemId;
  renderOutfitBuilder();
  closeModal('pickerModal');
  toast('已添加', 'success');
}

function removeFromSlot(slotKey) {
  delete outfitBuilder[slotKey];
  renderOutfitBuilder();
}

function clearOutfitBuilder() {
  outfitBuilder = {};
  renderOutfitBuilder();
}

function randomOutfit() {
  if (clothes.length === 0) { toast('衣橱是空的,先添加衣物', 'error'); return; }
  outfitBuilder = {};
  const currentMonth = new Date().getMonth();
  let season;
  if (currentMonth >= 2 && currentMonth <= 4) season = '春';
  else if (currentMonth >= 5 && currentMonth <= 7) season = '夏';
  else if (currentMonth >= 8 && currentMonth <= 10) season = '秋';
  else season = '冬';

  OUTFIT_SLOTS.forEach(s => {
    let pool = clothes.filter(c => c.category === s.key);
    if (pool.length === 0) return;
    const seasonMatch = pool.filter(c => (c.season||[]).includes(season));
    const finalPool = seasonMatch.length > 0 ? seasonMatch : pool;
    outfitBuilder[s.key] = finalPool[Math.floor(Math.random() * finalPool.length)].id;
  });
  renderOutfitBuilder();
  toast(`已根据${season}季推荐搭配`, 'success');
}

function saveOutfit() {
  const itemIds = Object.values(outfitBuilder);
  if (itemIds.length === 0) { toast('请先选择衣物', 'error'); return; }
  $('outfitName').value = '';
  openModal('nameModal');
  setTimeout(() => $('outfitName').focus(), 300);
}

function confirmSaveOutfit() {
  const name = $('outfitName').value.trim() || '未命名方案';
  const itemIds = Object.values(outfitBuilder);
  outfits.push({
    id: uid(),
    name,
    items: itemIds,
    createdAt: Date.now()
  });
  DB.set(DB.outfits, outfits);
  closeModal('nameModal');
  toast('方案已保存', 'success');
  renderSavedOutfits();
}

function renderSavedOutfits() {
  const container = $('savedOutfits');
  if (outfits.length === 0) {
    container.innerHTML = `<div class="empty-state"><svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" transform="rotate(45 12 12)"/></svg><p>还没有保存的穿搭方案</p><p class="hint">在上方搭配编辑器中创建并保存</p></div>`;
    return;
  }
  container.innerHTML = outfits.map(o => {
    const items = o.items.map(id => getClothing(id)).filter(Boolean);
    return `<div class="outfit-card">
      <div class="outfit-name">${escapeHtml(o.name)}</div>
      <div class="outfit-items">${items.map(c =>
        `<div class="outfit-item">
          ${c.image?`<img src="${c.image}" alt="${escapeHtml(c.name)}">`:`<svg class="placeholder" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="margin:12px auto"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>`}
          <div class="label">${c.category}</div>
        </div>`
      ).join('')}</div>
      <div class="outfit-footer">
        <span class="outfit-date">${new Date(o.createdAt).toLocaleDateString('zh-CN')}</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="wearOutfit('${o.id}')">记录穿着</button>
          <button class="btn btn-danger btn-sm" onclick="deleteOutfit('${o.id}')">删除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function deleteOutfit(id) {
  if (!confirm('删除这个穿搭方案?')) return;
  outfits = outfits.filter(o => o.id !== id);
  DB.set(DB.outfits, outfits);
  renderSavedOutfits();
  toast('已删除', 'success');
}

function wearOutfit(outfitId) {
  const today = fmtDate(new Date());
  openRecordModal(today, outfitId);
}

/* ==================== 穿着记录 ==================== */
function renderCalendar() {
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  $('calMonth').textContent = `${year}年${month+1}月`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = fmtDate(new Date());

  const weekdays = ['日','一','二','三','四','五','六'];
  let html = weekdays.map(w => `<div class="calendar-weekday">${w}</div>`).join('');

  for (let i = 0; i < firstDay; i++) html += '<div class="calendar-day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasRecord = records.some(r => r.date === dateStr);
    const isToday = dateStr === today;
    html += `<div class="calendar-day ${isToday?'today':''} ${hasRecord?'has-record':''}" onclick="openRecordModal('${dateStr}')">
      <span class="day-num">${d}</span>
      ${hasRecord?'<div class="dot-indicator"></div>':''}
    </div>`;
  }
  $('calendarGrid').innerHTML = html;
  renderRecordStats();
}

function changeMonth(delta) {
  calDate.setMonth(calDate.getMonth() + delta);
  renderCalendar();
}

function openRecordModal(dateStr, presetOutfitId) {
  editingRecordDate = dateStr;
  $('recordDate').value = dateStr;
  $('recordModalTitle').textContent = `${dateStr} 穿着记录`;
  $('recordNote').value = '';

  const existing = records.find(r => r.date === dateStr);
  $('recordDeleteBtn').style.display = existing ? 'block' : 'none';

  const list = $('recordOutfitList');
  if (outfits.length === 0) {
    list.innerHTML = '<p style="color:var(--text-mute);font-size:13px">还没有穿搭方案,请先在「穿搭」页面创建</p>';
  } else {
    const selectedId = existing?.outfitId || presetOutfitId || '';
    list.innerHTML = outfits.map(o => {
      const items = o.items.map(id => getClothing(id)).filter(Boolean);
      return `<div class="picker-item ${selectedId===o.id?'selected':''}" style="display:flex;align-items:center;gap:8px;padding:8px;text-align:left;border-radius:10px" onclick="selectRecordOutfit('${o.id}',this)">
        <div style="display:flex;gap:4px">
          ${items.slice(0,3).map(c => `<div style="width:32px;height:32px;border-radius:6px;overflow:hidden;background:#222">${c.image?`<img src="${c.image}" style="width:100%;height:100%;object-fit:cover">`:''}</div>`).join('')}
        </div>
        <span style="font-size:13px">${escapeHtml(o.name)}</span>
      </div>`;
    }).join('');
    $('recordOutfitList').dataset.selected = selectedId;
  }

  if (existing) {
    $('recordNote').value = existing.note || '';
  }
  openModal('recordModal');
}

function selectRecordOutfit(id, el) {
  document.querySelectorAll('#recordOutfitList .picker-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  $('recordOutfitList').dataset.selected = id;
}

function saveRecord() {
  const date = $('recordDate').value;
  const outfitId = $('recordOutfitList').dataset.selected;
  const note = $('recordNote').value.trim();

  if (!outfitId) { toast('请选择一个穿搭方案', 'error'); return; }

  const existing = records.find(r => r.date === date);
  if (existing) {
    existing.outfitId = outfitId;
    existing.note = note;
  } else {
    records.push({ id: uid(), date, outfitId, note });
  }
  DB.set(DB.records, records);
  closeModal('recordModal');
  renderCalendar();
  toast('穿着已记录', 'success');
}

function deleteRecord() {
  const date = $('recordDate').value;
  records = records.filter(r => r.date !== date);
  DB.set(DB.records, records);
  closeModal('recordModal');
  renderCalendar();
  toast('记录已删除', 'success');
}

function renderRecordStats() {
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const monthRecords = records.filter(r => {
    const [y,m] = r.date.split('-').map(Number);
    return y === year && m === month+1;
  });
  const wearDays = monthRecords.length;

  // 最常穿衣物 Top5
  const itemCount = {};
  monthRecords.forEach(r => {
    const outfit = outfits.find(o => o.id === r.outfitId);
    if (outfit) {
      outfit.items.forEach(id => {
        itemCount[id] = (itemCount[id]||0) + 1;
      });
    }
  });
  const topItems = Object.entries(itemCount).sort((a,b) => b[1]-a[1]).slice(0,5);
  const maxCount = topItems.length > 0 ? topItems[0][1] : 1;

  $('recordStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">本月穿着天数</div>
      <div class="stat-value">${wearDays}<span class="unit">天</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">穿搭方案数</div>
      <div class="stat-value">${outfits.length}<span class="unit">套</span></div>
    </div>
  `;

  if (topItems.length === 0) {
    $('topWorn').innerHTML = '<p style="color:var(--text-mute);font-size:13px;text-align:center;padding:12px">本月还没有穿着记录</p>';
  } else {
    $('topWorn').innerHTML = topItems.map(([id, cnt], i) => {
      const c = getClothing(id);
      if (!c) return '';
      return `<div class="top-worn-item">
        <span class="rank">${i+1}</span>
        <div class="thumb">${c.image?`<img src="${c.image}">`:''}</div>
        <div class="info">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="count">穿了 ${cnt} 次</div>
          <div class="bar" style="width:${cnt/maxCount*100}%"></div>
        </div>
      </div>`;
    }).join('');
  }
}

/* ==================== 分类统计 ==================== */
function renderStats() {
  // 总览
  const totalCount = clothes.length;
  const catCount = {};
  CATEGORIES.forEach(c => catCount[c] = 0);
  clothes.forEach(c => { if (catCount[c.category] !== undefined) catCount[c.category]++; });

  const overviewHtml = [
    {num: totalCount, label: '衣物总数'},
    ...CATEGORIES.map(c => ({num: catCount[c], label: c}))
  ].map(o => `<div class="overview-card"><div class="num">${o.num}</div><div class="label">${o.label}</div></div>`).join('');
  $('statsOverview').innerHTML = overviewHtml;

  // 饼图 - 按类别
  const activeCats = CATEGORIES.filter(c => catCount[c] > 0);
  if (totalCount === 0) {
    $('pieChart').style.background = 'var(--card)';
    $('pieLegend').innerHTML = '<p style="color:var(--text-mute);font-size:13px;text-align:center">暂无数据</p>';
  } else {
    let gradientParts = [];
    let accumulated = 0;
    activeCats.forEach(cat => {
      const pct = catCount[cat] / totalCount * 100;
      const color = CATEGORY_COLORS[cat];
      gradientParts.push(`${color} ${accumulated}% ${accumulated+pct}%`);
      accumulated += pct;
    });
    $('pieChart').style.background = `conic-gradient(${gradientParts.join(',')})`;
    $('pieLegend').innerHTML = activeCats.map(cat => {
      const pct = (catCount[cat] / totalCount * 100).toFixed(1);
      return `<div class="pie-legend-item">
        <div class="swatch" style="background:${CATEGORY_COLORS[cat]}"></div>
        <span>${cat}</span>
        <span style="margin-left:auto;display:flex;gap:8px"><span>${catCount[cat]}件</span><span class="pct">${pct}%</span></span>
      </div>`;
    }).join('');
  }

  // 柱状图 - 按季节
  const seasonCount = {春:0,夏:0,秋:0,冬:0};
  clothes.forEach(c => { (c.season||[]).forEach(s => { if (seasonCount[s] !== undefined) seasonCount[s]++; }); });
  const maxSeason = Math.max(...Object.values(seasonCount), 1);
  $('barChart').innerHTML = SEASONS.map(s => {
    const cnt = seasonCount[s];
    const h = cnt / maxSeason * 100;
    return `<div class="bar-col">
      <div class="bar-val">${cnt}</div>
      <div class="bar" style="height:${h}%;background:linear-gradient(to top,${s==='春'?'#22c55e':s==='夏'?'#f59e0b':s==='秋'?'#ea580c':'#3b82f6'},rgba(255,255,255,0.1))"></div>
      <div class="bar-label">${SEASON_EMOJI[s]}${s}</div>
    </div>`;
  }).join('');

  // 颜色分布
  const colorCount = {};
  clothes.forEach(c => {
    if (c.color) colorCount[c.color] = (colorCount[c.color]||0) + 1;
  });
  const colorEntries = Object.entries(colorCount).sort((a,b) => b[1]-a[1]);
  if (colorEntries.length === 0) {
    $('colorStats').innerHTML = '<p style="color:var(--text-mute);font-size:13px">暂无颜色数据</p>';
  } else {
    $('colorStats').innerHTML = colorEntries.map(([name, cnt]) => {
      const colorObj = COLORS.find(c => c.name === name);
      return `<div class="color-stat-item">
        <div class="dot" style="background:${colorObj?colorObj.hex:'#888'}"></div>
        <span>${name}</span>
        <span class="cnt">${cnt}</span>
      </div>`;
    }).join('');
  }
}

/* ==================== 初始化 ==================== */
function init() {
  initColorPicker();
  renderClothes();

  $('searchInput').addEventListener('input', renderClothes);
  $('filterCategory').addEventListener('change', renderClothes);
  $('filterSeason').addEventListener('change', renderClothes);

  // 点击遮罩关闭弹窗
  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', (e) => {
      if (e.target === o) o.classList.remove('show');
    });
  });
}

init();
</script>
